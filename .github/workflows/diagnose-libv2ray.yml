# One-off diagnostic - typechecks a probe file against the real
# Libv2ray.xcframework, trying several plausible spellings for each symbol
# PacketTunnelProvider.swift needs, so the correct ones can be read directly
# from which probe functions error vs which don't - instead of guessing.
# (swift-ide-test isn't reliably on PATH on the hosted runner, plain swiftc
# -typecheck needs nothing extra.)
# Reuses the Libv2ray.xcframework artifact from a prior build-ios-app.yml
# run instead of rebuilding it. Not meant to stay long-term - delete once
# PacketTunnelProvider.swift's symbol names are confirmed correct.

name: Diagnose Libv2ray Swift interface

on:
  workflow_dispatch:
    inputs:
      source_run_id:
        description: "Run ID of a build-ios-app.yml run that has the Libv2ray-xcframework artifact"
        required: true

jobs:
  diagnose:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download Libv2ray.xcframework
        uses: actions/download-artifact@v4
        with:
          name: Libv2ray-xcframework
          path: Frameworks/Libv2ray.xcframework
          github-token: ${{ github.token }}
          run-id: ${{ github.event.inputs.source_run_id }}

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app

      - name: Typecheck symbol probe (simulator slice)
        run: |
          swiftc -typecheck \
            -F "Frameworks/Libv2ray.xcframework/ios-arm64_x86_64-simulator" \
            -sdk "$(xcrun --sdk iphonesimulator --show-sdk-path)" \
            -target arm64-apple-ios17.0-simulator \
            .github/diagnostics/LibV2raySymbolProbe.swift 2>&1 || true
