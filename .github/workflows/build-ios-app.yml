# Builds the actual pantherapp iOS app on every push - the real compile +
# link check for everything under Shared/ and PantherTunnel/, none of which
# can be built on the Windows machine this repo is normally edited from.
#
# Three jobs:
#  1. build-xray-framework - same gomobile pipeline as build-ios-xray.yml,
#     duplicated here (not called as a dependency) so this workflow has no
#     cross-workflow-artifact fragility and always builds against a fresh
#     checkout of AndroidLibXrayLite's main branch.
#  2. build-app - drops that framework at Frameworks/Libv2ray.xcframework
#     (the exact path project.yml's PantherTunnel target expects), runs
#     XcodeGen to regenerate pantherapp.xcodeproj from project.yml (so every
#     .swift file actually gets built, not just whatever was last added by
#     hand in Xcode - see project.yml's header comment), then builds for the
#     iOS Simulator with signing disabled so no Apple Developer secrets are
#     needed to catch real compile errors.
#  3. run-tests - independent of build-app (own needs: on build-xray-framework
#     only), runs the pantherappTests unit tests (currently just
#     CabinetRepositoryParsingTests). Deliberately a separate job: this target
#     is newer/less proven than the main app build, so a problem with it
#     (e.g. the non-hosted @testable import turning out to need TEST_HOST)
#     shows up as its own isolated red job instead of muddying the
#     "does the app actually compile" signal from build-app.
#  4. build-ipa-uitest - builds the pantherapp-uitest target (see project.yml
#     - same UI/logic, no PantherTunnel, no NetworkExtension entitlement) for
#     a real device, unsigned, and zips it into an .ipa artifact. No
#     dependency on build-xray-framework since this target doesn't link
#     Libv2ray at all. Meant to be sideloaded via AltStore/SideStore, which
#     re-sign with the installer's own free Apple ID - only possible because
#     this variant carries no entitlement a free account can't have.
#  5. build-ipa-full - same idea but the REAL pantherapp target, extension
#     included. An unsigned build doesn't check entitlement eligibility at
#     all (that only happens when something actually signs it), so this is
#     worth producing and trying - AltStore/SideStore might install it with
#     the NetworkExtension entitlement silently stripped (VPN inert, same as
#     uitest) rather than failing outright. Genuinely unverified either way;
#     that's the point of trying it against a real installer instead of
#     guessing.
#
# build-app/run-tests do NOT produce a device-installable/App-Store build for
# the REAL app - that needs real signing plus a paid Apple Developer account
# for the Network Extension entitlement. They're "does the whole app actually
# compile and link", which was previously impossible to check before reaching
# a Mac. build-ipa-uitest and build-ipa-full are the two jobs that produce
# something installable.

name: Build iOS app

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build-xray-framework:
    runs-on: macos-latest
    steps:
      - name: Checkout AndroidLibXrayLite
        uses: actions/checkout@v4
        with:
          repository: 2dust/AndroidLibXrayLite
          ref: main
          path: AndroidLibXrayLite

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: "AndroidLibXrayLite/go.mod"

      - name: Install gomobile
        run: |
          go install golang.org/x/mobile/cmd/gomobile@latest
          go install golang.org/x/mobile/cmd/gobind@latest
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Download geoip/geosite assets
        working-directory: AndroidLibXrayLite
        run: |
          mkdir -p assets data
          curl -sL https://github.com/Loyalsoldier/v2ray-rules-dat/releases/latest/download/geoip.dat -o data/geoip.dat
          curl -sL https://github.com/Loyalsoldier/v2ray-rules-dat/releases/latest/download/geosite.dat -o data/geosite.dat
          curl -sL https://raw.githubusercontent.com/Loyalsoldier/geoip/release/geoip-only-cn-private.dat -o data/geoip-only-cn-private.dat
          cp data/*.dat assets/

      - name: gomobile init
        working-directory: AndroidLibXrayLite
        run: gomobile init

      - name: go mod tidy
        working-directory: AndroidLibXrayLite
        run: go mod tidy

      - name: gomobile bind (iOS + iOS Simulator)
        working-directory: AndroidLibXrayLite
        run: |
          gomobile bind -v -target=ios,iossimulator -trimpath \
            -ldflags='-s -w' \
            -o Libv2ray.xcframework \
            ./

      - name: Upload Libv2ray.xcframework
        uses: actions/upload-artifact@v4
        with:
          name: Libv2ray-xcframework
          path: AndroidLibXrayLite/Libv2ray.xcframework

  build-app:
    needs: build-xray-framework
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download Libv2ray.xcframework
        uses: actions/download-artifact@v4
        with:
          name: Libv2ray-xcframework
          path: Frameworks/Libv2ray.xcframework

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build (iOS Simulator, unsigned)
        run: |
          xcodebuild build \
            -project pantherapp.xcodeproj \
            -scheme pantherapp \
            -destination "generic/platform=iOS Simulator" \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO

  run-tests:
    needs: build-xray-framework
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download Libv2ray.xcframework
        uses: actions/download-artifact@v4
        with:
          name: Libv2ray-xcframework
          path: Frameworks/Libv2ray.xcframework

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      # Picks whatever iPhone simulator the runner's Xcode actually has
      # installed, rather than hardcoding a device name that WWDC-cycle
      # Xcode bumps on GitHub's macos-latest image would eventually break.
      - name: Pick an available iOS Simulator
        id: sim
        run: |
          UDID=$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          data = json.load(sys.stdin)
          for runtime, devices in data["devices"].items():
              if "iOS" not in runtime:
                  continue
              for d in devices:
                  if d["name"].startswith("iPhone"):
                      print(d["udid"])
                      sys.exit(0)
          sys.exit(1)
          ')
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"

      - name: Run unit tests
        run: |
          xcodebuild test \
            -project pantherapp.xcodeproj \
            -scheme pantherapp \
            -destination "id=${{ steps.sim.outputs.udid }}" \
            CODE_SIGNING_ALLOWED=NO

  build-ipa-uitest:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build (real device, unsigned)
        run: |
          xcodebuild build \
            -project pantherapp.xcodeproj \
            -scheme pantherapp-uitest \
            -destination "generic/platform=iOS" \
            -configuration Release \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO

      - name: Package .ipa
        run: |
          APP_PATH="build/Build/Products/Release-iphoneos/pantherapp-uitest.app"
          mkdir -p Payload
          cp -r "$APP_PATH" Payload/
          zip -r pantherapp-uitest.ipa Payload

      - name: Upload .ipa
        uses: actions/upload-artifact@v4
        with:
          name: pantherapp-uitest-ipa
          path: pantherapp-uitest.ipa

  build-ipa-full:
    needs: build-xray-framework
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download Libv2ray.xcframework
        uses: actions/download-artifact@v4
        with:
          name: Libv2ray-xcframework
          path: Frameworks/Libv2ray.xcframework

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build (real device, unsigned)
        run: |
          xcodebuild build \
            -project pantherapp.xcodeproj \
            -scheme pantherapp \
            -destination "generic/platform=iOS" \
            -configuration Release \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO

      - name: Package .ipa
        run: |
          APP_PATH="build/Build/Products/Release-iphoneos/pantherapp.app"
          mkdir -p Payload
          cp -r "$APP_PATH" Payload/
          zip -r pantherapp-full.ipa Payload

      - name: Upload .ipa
        uses: actions/upload-artifact@v4
        with:
          name: pantherapp-full-ipa
          path: pantherapp-full.ipa
