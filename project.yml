# XcodeGen spec — the source of truth for pantherapp.xcodeproj.
#
# Why: this project was hand-edited for months of Windows-side work without
# Xcode to keep files in sync (the old .pbxproj format has no
# PBXFileSystemSynchronizedRootGroup, so new .swift files never auto-appear
# in a target). Every file written from here on is picked up automatically
# by folder globbing instead of needing manual "Add Files to target..." in
# Xcode, and CI regenerates the exact same project on every build.
#
# Local use (once you have a Mac): `brew install xcodegen`, then
# `xcodegen generate` in this folder before opening pantherapp.xcodeproj.
# CI does the same thing — see .github/workflows/build-ios-app.yml.
#
# No macOS target: an iOS-only app was the explicit decision early in this
# port (see the plan doc) - the stock macOS/Tests-macOS targets from the
# original Xcode template are intentionally not carried over here.

name: pantherapp
options:
  bundleIdPrefix: com.panthervpn
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

configs:
  Debug: debug
  Release: release

settings:
  base:
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: 8D9LBM3LN2
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "1.5"
    CURRENT_PROJECT_VERSION: "1"
    TARGETED_DEVICE_FAMILY: "1,2"

targets:
  pantherapp:
    type: application
    platform: iOS
    sources:
      - path: Shared
    info:
      path: pantherapp/Info.plist
      properties:
        CFBundleDevelopmentRegion: ru
        CFBundleDisplayName: PantherVPN
        CFBundleURLTypes:
          - CFBundleTypeRole: Editor
            CFBundleURLName: com.panthervpn.pantherapp
            CFBundleURLSchemes: [panthervpn]
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UIApplicationSupportsIndirectInputEvents: true
        UILaunchScreen:
          UIColorName: LaunchBackground
          UIImageName: LaunchLogo
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    entitlements:
      path: pantherapp/pantherapp.entitlements
      properties:
        com.apple.developer.networking.networkextension:
          - packet-tunnel-provider
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.panthervpn.pantherapp
        PRODUCT_NAME: pantherapp
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    dependencies:
      - target: PantherTunnel
        embed: true
    scheme:
      testTargets:
        - pantherappTests

  pantherappTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests/pantherappTests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.panthervpn.pantherapp.Tests
        # Deliberately NOT hosted (no TEST_HOST/BUNDLE_LOADER) - these tests
        # are pure Foundation logic (CabinetRepository.parseServers) with no
        # need to run inside the actual app process. If @testable import
        # pantherapp turns out to need hosting after all, that'll show up as
        # a clear, isolated failure in the "run-tests" CI job only - it can't
        # affect the "build-app" job, which doesn't reference this target.
    dependencies:
      - target: pantherapp

  PantherTunnel:
    type: app-extension
    platform: iOS
    sources:
      - path: PantherTunnel
    info:
      path: PantherTunnel/Info.plist
      properties:
        CFBundleDisplayName: PantherTunnel
        NSExtension:
          NSExtensionPointIdentifier: com.apple.networkextension.packet-tunnel
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).PacketTunnelProvider
    entitlements:
      path: PantherTunnel/PantherTunnel.entitlements
      properties:
        com.apple.developer.networking.networkextension:
          - packet-tunnel-provider
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.panthervpn.pantherapp.PantherTunnel
        PRODUCT_NAME: PantherTunnel
        SKIP_INSTALL: YES
    dependencies:
      # Built by the "build-xray-framework" job in
      # .github/workflows/build-ios-app.yml (or manually via
      # build-ios-xray.yml, then drop the .xcframework here) — only
      # PantherTunnel links it, the main app talks to the tunnel purely
      # through NETunnelProviderManager and never imports Libv2ray itself.
      - framework: Frameworks/Libv2ray.xcframework
        embed: true
