# XcodeGen spec — the source of truth for pantherapp.xcodeproj.
#
# Why: this project was hand-edited for months of Windows-side work without
# Xcode to keep files in sync (the old .pbxproj format has no
# PBXFileSystemSynchronizedRootGroup, so new .swift files never auto-appear
# in a target). Every file written from here on is picked up automatically
# by folder globbing instead of needing manual "Add Files to target..." in
# Xcode, and CI regenerates the exact same project on every build.
#
# Local use (once you have a Mac): `brew install xcodegen`, then
# `xcodegen generate` in this folder before opening pantherapp.xcodeproj.
# CI does the same thing — see .github/workflows/build-ios-app.yml.
#
# No macOS target: an iOS-only app was the explicit decision early in this
# port (see the plan doc) - the stock macOS/Tests-macOS targets from the
# original Xcode template are intentionally not carried over here.

name: pantherapp
options:
  bundleIdPrefix: com.panthervpn
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

configs:
  Debug: debug
  Release: release

settings:
  base:
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: 8D9LBM3LN2
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "1.5"
    CURRENT_PROJECT_VERSION: "1"
    TARGETED_DEVICE_FAMILY: "1,2"

targets:
  pantherapp:
    type: application
    platform: iOS
    sources:
      - path: Shared
    info:
      path: pantherapp/Info.plist
      properties:
        CFBundleDevelopmentRegion: ru
        CFBundleDisplayName: PantherVPN
        CFBundleURLTypes:
          - CFBundleTypeRole: Editor
            CFBundleURLName: com.panthervpn.pantherapp
            CFBundleURLSchemes: [panthervpn]
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UIApplicationSupportsIndirectInputEvents: true
        UILaunchScreen:
          UIColorName: LaunchBackground
          UIImageName: LaunchLogo
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    entitlements:
      path: pantherapp/pantherapp.entitlements
      properties:
        com.apple.developer.networking.networkextension:
          - packet-tunnel-provider
        # Lets AppLogger share one log buffer with PantherTunnel (see its
        # own entitlements below) - free/personal-team accounts can use App
        # Groups fine, unlike the networkextension entitlement above.
        com.apple.security.application-groups:
          - group.com.panthervpn.pantherapp
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.panthervpn.pantherapp
        PRODUCT_NAME: pantherapp
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    dependencies:
      - target: PantherTunnel
        embed: true
    scheme:
      testTargets:
        - pantherappTests

  # UI-testing-only variant of the main app - same Shared/ source tree, but
  # no PantherTunnel dependency and no NetworkExtension entitlement, so it
  # needs no Apple Developer Program membership to sign at all (that
  # entitlement is the one thing a free/personal-team Apple ID can't get).
  # The Connect button won't actually establish a VPN (no extension to talk
  # to), but every other screen - auth, servers list, profile, settings,
  # protection toggles, traffic stats - is fully live. Built unsigned in CI
  # (see build-ios-app.yml's build-ipa-uitest job) and meant to be sideloaded
  # via AltStore/SideStore, which re-sign with the installer's own free
  # Apple ID - something that only works because this target carries no
  # entitlement a free account can't have.
  pantherapp-uitest:
    type: application
    platform: iOS
    sources:
      - path: Shared
    info:
      path: pantherapp-uitest/Info.plist
      properties:
        CFBundleDevelopmentRegion: ru
        CFBundleDisplayName: PantherVPN (UI test)
        CFBundleURLTypes:
          - CFBundleTypeRole: Editor
            CFBundleURLName: com.panthervpn.pantherapp.uitest
            CFBundleURLSchemes: [panthervpn]
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UIApplicationSupportsIndirectInputEvents: true
        UILaunchScreen:
          UIColorName: LaunchBackground
          UIImageName: LaunchLogo
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.panthervpn.pantherapp.uitest
        PRODUCT_NAME: pantherapp-uitest
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        # No signing identity/team at all - AltStore/SideStore (or a real
        # Developer Program account later) supply their own when installing.
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: ""
        CODE_SIGNING_REQUIRED: NO
        CODE_SIGNING_ALLOWED: NO
        DEVELOPMENT_TEAM: ""

  pantherappTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests/pantherappTests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.panthervpn.pantherapp.Tests
        # Deliberately NOT hosted (no TEST_HOST/BUNDLE_LOADER) - these tests
        # are pure Foundation logic (CabinetRepository.parseServers) with no
        # need to run inside the actual app process. If @testable import
        # pantherapp turns out to need hosting after all, that'll show up as
        # a clear, isolated failure in the "run-tests" CI job only - it can't
        # affect the "build-app" job, which doesn't reference this target.
    dependencies:
      - target: pantherapp

  PantherTunnel:
    type: app-extension
    platform: iOS
    sources:
      - path: PantherTunnel
      # Compiled into this target too (alongside the main app) so both
      # processes share one AppLogger implementation - see its own header
      # comment for why this is a plain shared file, not a framework.
      - path: Shared/Support/AppLogger.swift
    info:
      path: PantherTunnel/Info.plist
      properties:
        CFBundleDisplayName: PantherTunnel
        NSExtension:
          NSExtensionPointIdentifier: com.apple.networkextension.packet-tunnel
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).PacketTunnelProvider
    entitlements:
      path: PantherTunnel/PantherTunnel.entitlements
      properties:
        com.apple.developer.networking.networkextension:
          - packet-tunnel-provider
        com.apple.security.application-groups:
          - group.com.panthervpn.pantherapp
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.panthervpn.pantherapp.PantherTunnel
        PRODUCT_NAME: PantherTunnel
        SKIP_INSTALL: YES
        # Go's runtime DNS resolver (compiled into Libv2ray.xcframework via
        # cgo) references libresolv's res_9_* symbols directly - without
        # this the linker fails with "Undefined symbols ... referenced from:
        # _runtime.text in Libv2ray(go.o)". Confirmed by CI.
        OTHER_LDFLAGS: -lresolv
    dependencies:
      # Built by the "build-xray-framework" job in
      # .github/workflows/build-ios-app.yml (or manually via
      # build-ios-xray.yml, then drop the .xcframework here) — only
      # PantherTunnel links it, the main app talks to the tunnel purely
      # through NETunnelProviderManager and never imports Libv2ray itself.
      - framework: Frameworks/Libv2ray.xcframework
        embed: true
